name: app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.1

environment:
  sdk: '^3.13.4'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.2
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  http: ^1.6.0
  image_picker: ^1.2.3
  geolocator: ^14.0.3
  fl_chart: ^1.2.0
  mask_text_input_formatter: ^2.8.0
  google_fonts: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1 # Pacote para o ícone do celular
  flutter_native_splash: ^2.4.1   # Pacote para remover a splash do Flutter

flutter:
  uses-material-design: true
  assets:
    - assets/animacao-splash.mp4
    - assets/logo.png
    - shorebird.yaml # O ícone estático que você deve adicionar na pasta

# --- CONFIGURAÇÕES DE ÍCONE E SPLASH ---

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"

flutter_native_splash:
  color: "#FFFFFF" # O exato fundo branco do seu vídeo para transição invisível
  android: true
  ios: true
  fullscreen: true